# VPS deployment — serves the explorer at fantasy.maybesomething.tech beside the
# existing n8n stack, whose Traefik terminates TLS (cert resolver
# `mytlschallenge`, network `n8n_default`).
#
# The image builds straight from GitHub, so deploying an update is: push to
# main, then "Update" the `sleeper-playground` Docker project in hPanel (or
# `docker compose up -d --build` on the VPS).

services:
  sleeper:
    build:
      context: https://github.com/xxlillusion/sleeper-playground.git#main
    image: sleeper-explorer:latest
    pull_policy: build
    restart: always
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.sleeper.rule=Host(`fantasy.maybesomething.tech`)
      - traefik.http.routers.sleeper.entrypoints=websecure
      - traefik.http.routers.sleeper.tls=true
      - traefik.http.routers.sleeper.tls.certresolver=mytlschallenge
      - traefik.http.services.sleeper.loadbalancer.server.port=80

networks:
  traefik:
    name: n8n_default
    external: true
