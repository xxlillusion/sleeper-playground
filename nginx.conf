server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite names these by content hash, so they can be cached forever. ^~ keeps the no-cache rule below off them.
    location ^~ /league/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The league page reads its league id from the query string; any path under /league/ is the same app
    location /league/ {
        try_files $uri $uri/ /league/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages change on redeploy, so don't let browsers hold stale copies
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
}
